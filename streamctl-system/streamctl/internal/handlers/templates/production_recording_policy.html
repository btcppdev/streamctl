{{define "productionRecordingNotice"}}
<div class="recording-policy recording-policy-{{.Level}}"><strong>{{if .Title}}{{.Title}} · {{end}}{{.Label}}</strong><span>{{.Detail}}</span></div>
{{end}}
{{define "productionRecordingPolicyUI"}}
<style>
.recording-policy{display:block;margin:8px 0;padding:9px 12px;border:1px solid var(--border);border-left-width:4px;border-radius:5px;font-size:12px;white-space:normal;overflow-wrap:anywhere}.recording-policy strong,.recording-policy span{display:block}.recording-policy span{margin-top:3px}.recording-policy-allowed{border-left-color:var(--success);background:rgba(85,217,139,.07)}.recording-policy-limited,.recording-policy-unknown{border-color:var(--warn);background:rgba(255,193,7,.10)}.recording-policy-prohibited{border-color:#ff6b70;background:rgba(255,107,112,.14)}.recording-policy-prohibited strong{color:#ff8b90}.recording-policy[hidden]{display:none}
</style>
<script>
const productionRecordingPolicies={{recordingPolicyCatalog}};
function showProductionRecordingNotice(node,notice){
 node.className='recording-policy recording-policy-'+notice.level;
 node.replaceChildren();
 const label=document.createElement('strong'),detail=document.createElement('span');
 label.textContent=(notice.title?notice.title+' · ':'')+notice.label;detail.textContent=notice.detail;
 node.append(label,detail);
}
</script>
{{end}}
