{{define "renderSettingsUI"}}
<style>.settings-panel{margin:14px 0;border:1px solid var(--border);border-radius:7px;background:var(--panel)}.settings-panel summary{padding:12px 14px;cursor:pointer;font-weight:600}.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;padding:12px 14px}.settings-grid label{display:grid;gap:5px}.settings-grid input,.settings-grid select{width:100%;padding:7px 8px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text)}</style>
<script>
const productionSettingSpecs=[['width','Width',1920,'number'],['height','Height',1080,'number'],['fps','Frame rate',30,'number'],['transitionMs','Transition (ms)',1000,'number'],['imageMs','Default image duration (ms)',4000,'number'],['audioSampleRate','Audio sample rate',48000,'number'],['videoEncoder','Video encoder','auto','select'],['videoBitrate','Video bitrate','6800k','text'],['audioBitrate','Audio bitrate','160k','text'],['keyframeInterval','Keyframe interval (seconds)',2,'number'],['nvencCq','NVENC CQ',23,'number'],['softwarePreset','Software preset','medium','text'],['softwareCrf','Software CRF',23,'number']];
function populateRenderSettings(root,settings){root.replaceChildren();for(const [key,label,fallback,type] of productionSettingSpecs){const wrap=document.createElement('label');wrap.textContent=label;const control=document.createElement(type==='select'?'select':'input');control.setAttribute('aria-label',label);if(type==='select'){for(const value of ['auto','software','videotoolbox','nvenc'])control.add(new Option(value,value));control.value=settings[key]??fallback}else{control.type=type;control.value=settings[key]??fallback}control.oninput=()=>settings[key]=type==='number'?Number(control.value):control.value;wrap.append(control);root.append(wrap)}}
</script>
{{end}}
