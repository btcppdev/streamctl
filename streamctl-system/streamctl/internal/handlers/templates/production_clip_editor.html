{{define "productionClipEditor"}}
<dialog id="clip-import-dialog" aria-labelledby="clip-import-title">
 <div class="dialog-head"><strong id="clip-import-title">Add from template</strong><button type="button" class="btn" id="clip-import-close">Close</button></div>
 <div style="padding:14px">
  <label class="field">Template<select id="clip-template" aria-label="Clip template" style="width:100%"></select></label>
  <div id="clip-talks" style="display:grid;gap:8px;margin:12px 0"></div>
  <p class="muted" id="clip-import-note">Adds an editable snapshot. This project keeps its render settings.</p>
  <p id="clip-import-status" role="status" aria-live="polite"></p>
  <div id="clip-import-review" style="max-height:40vh;overflow:auto"></div>
  <div class="clip-tools"><button type="button" class="btn" id="clip-import-preview">Review clips</button><button type="button" class="btn btn-primary" id="clip-import-apply" disabled>Add clips</button></div>
 </div>
</dialog>
<script>
const ClipImport=(()=>{
 const dialog=document.getElementById('clip-import-dialog'),title=document.getElementById('clip-import-title'),chooser=document.getElementById('clip-template'),talkList=document.getElementById('clip-talks'),review=document.getElementById('clip-import-review'),status=document.getElementById('clip-import-status'),inspect=document.getElementById('clip-import-preview'),apply=document.getElementById('clip-import-apply');
 let options=[],talks=[],talksError='',refresh=null,signature='',pending=null,epoch=0,replacementTalkId=null;
 const invalidate=()=>{epoch++;pending=null;apply.disabled=true;inspect.disabled=false;status.textContent='';review.replaceChildren()};
 function showTalks(){invalidate();talkList.replaceChildren();const option=options.find(x=>String(x.id)===chooser.value);if(!option?.needsTalk)return;if(talksError){inspect.disabled=true;status.textContent=talksError;return}for(const talk of talks){if(refresh&&talk.talk_id!==(replacementTalkId||refresh.talk?.id))continue;const label=document.createElement('label');label.className='check-field';label.style.width='auto';label.style.whiteSpace='normal';const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.value=talk.talk_id;checkbox.checked=!!refresh;checkbox.disabled=(!talk.eligible&&!talk.manualOnly)||!!refresh;checkbox.onchange=invalidate;label.append(checkbox,document.createTextNode(talk.title+(talk.starts_at?' · '+talk.starts_at.slice(0,16).replace('T',' '):'')+(talk.manualOnly?' · individual selection only':!talk.eligible?' · unavailable':'')));appendProductionRecordingTag(label,talk.recordingNotice);talkList.appendChild(label)}}
 async function responseJSON(response){if(!(response.headers.get('content-type')||'').includes('application/json'))throw Error('Could not load templates. Reload and try again.');const result=await response.json();if(!response.ok)throw Error(result.error||'Could not expand template.');return result}
 function describe(segment){return [segment.type==='image'?'Card':'Video',basename(segment.src),segment.type==='image'?`${segment.durationMs??settings.imageMs??4000} ms`:`${segment.in||'start'} → ${segment.out||'end'}`,segment.overlay?'Overlay: '+basename(segment.overlay):'No overlay',segment.audio?`Audio: ${basename(segment.audio.src)} · ${segment.audio.mode||'replace'} · starts ${segment.audio.in||'00:00:00.000'} · ${segment.audio.gainDb??0} dB / source ${segment.audio.sourceGainDb??0} dB`:'Source audio',segment.transcribe?'Transcribe':''].filter(Boolean).join(' · ')}
 function contents(label,clip){const section=document.createElement('section'),heading=document.createElement('strong');heading.textContent=label+' · '+clip.name;section.appendChild(heading);if(clip.talk?.schedule){const time=document.createElement('p');time.className='muted';time.textContent=clip.talk.schedule;section.appendChild(time)}const list=document.createElement('ol');for(const child of clip.segments){const li=document.createElement('li');li.textContent=describe(child);list.appendChild(li)}section.appendChild(list);review.appendChild(section)}
 async function open(target=null,talkId=null){replacementTalkId=talkId;if(previewMode!=='edit')return;refresh=target;signature=target?JSON.stringify(target):'';invalidate();const token=epoch;chooser.replaceChildren();chooser.disabled=true;talkList.replaceChildren();title.textContent=refresh?(replacementTalkId?'Replace talk':'Refresh from template'):'Add from template';inspect.textContent=refresh?'Review changes':'Review clips';apply.textContent=refresh?'Replace clip contents':'Add clips';inspect.disabled=true;status.textContent='Loading templates…';dialog.showModal();try{const result=await responseJSON(await fetch(`/production/renders/template-options?conference=${encodeURIComponent(conference)}`));if(token!==epoch||!dialog.open)return;options=result.templates;talks=result.talks;talksError=result.talksError||'';for(const item of options)chooser.add(new Option(item.name+(item.needsTalk?' · uses talks':''),String(item.id)));if(refresh){if(!options.some(x=>x.id===refresh.template.id))throw Error('The originating template is missing. Your existing clip is unchanged.');chooser.value=String(refresh.template.id)}chooser.disabled=!!refresh;inspect.disabled=false;showTalks()}catch(error){if(token===epoch)status.textContent=error.message}}
 chooser.onchange=showTalks;
 inspect.onclick=async()=>{invalidate();const token=epoch;inspect.disabled=true;status.textContent='Resolving template…';const body=new URLSearchParams({conference,template_id:chooser.value,csrf_token:document.querySelector('#template-form input[name="csrf_token"]').value});if(refresh?.talk)body.append('talk_ids',replacementTalkId||refresh.talk.id);else for(const checkbox of talkList.querySelectorAll('input:checked'))body.append('talk_ids',checkbox.value);try{const result=await responseJSON(await fetch('/production/renders/expand-template',{method:'POST',body}));if(token!==epoch||!dialog.open)return;if(refresh&&result.clips.length!==1)throw Error('Refresh must resolve exactly one clip.');pending=result.clips;if(refresh){contents('Current',refresh);contents('Replacement',pending[0]);status.textContent='The clip stays in this position. Applying replaces its talk and contents, including manual edits.'}else{for(const clip of pending)contents('New clip',clip);status.textContent=`${pending.length} clip${pending.length===1?'':'s'} ready to add.`}apply.disabled=false}catch(error){if(token===epoch)status.textContent=error.message}finally{if(token===epoch)inspect.disabled=false}};
 apply.onclick=()=>{if(previewMode!=='edit'||!pending)return;if(refresh){const index=segments.indexOf(refresh);if(index<0||JSON.stringify(refresh)!==signature){status.textContent='The draft changed. Review the replacement again.';invalidate();return}if(!refresh.talk)pending[0].name=refresh.name;segments[index]=pending[0];const at=flatEntries().findIndex(e=>e.top===index);dialog.close();renderSegments(at)}else{const first=leafSegments().length;segments.push(...pending);dialog.close();renderSegments(first)}};
 document.getElementById('clip-import-close').onclick=()=>dialog.close();dialog.addEventListener('close',invalidate);
 return {open};
})();
function openTemplateImport(clip=null,talkId=null){return ClipImport.open(clip,talkId)}
</script>
{{end}}
