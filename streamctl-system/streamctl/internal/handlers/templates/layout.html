{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>streamctl</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<style>
:root {
	--bg: #0f1115;
	--panel: #161922;
	--border: #2a2f3a;
	--text: #e8eaed;
	--muted: #8a93a4;
	--accent: #6ea8fe;
	--danger: #ef6b6b;
	--success: #5dd39e;
	--warn: #f5c267;
}
* { box-sizing: border-box; }
body {
	margin: 0;
	font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
	background: var(--bg);
	color: var(--text);
}
header {
	border-bottom: 1px solid var(--border);
	padding: 12px 24px;
	display: flex;
	align-items: center;
	gap: 24px;
}
header h1 { font-size: 16px; margin: 0; }
header nav a {
	color: var(--muted);
	text-decoration: none;
	margin-right: 16px;
}
header nav a:hover { color: var(--text); }
header .right { margin-left: auto; display: flex; align-items: center; gap: 12px; color: var(--muted); }
main { max-width: 1320px; margin: 24px auto; padding: 0 16px; }
h2 { font-size: 18px; margin: 24px 0 12px; }
table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); }
th { font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
tr:last-child td { border-bottom: none; }
.btn {
	display: inline-block;
	padding: 6px 12px;
	border: 1px solid var(--border);
	background: var(--panel);
	color: var(--text);
	border-radius: 4px;
	text-decoration: none;
	font-size: 13px;
	cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); color: #0f1115; border-color: var(--accent); }
.btn-danger { color: var(--danger); }
.badge {
	display: inline-block;
	padding: 2px 8px;
	border-radius: 10px;
	font-size: 11px;
	font-weight: 600;
	text-transform: uppercase;
}
.badge-active { background: rgba(93,211,158,0.15); color: var(--success); }
.badge-now { background: rgba(110,168,254,0.18); color: var(--accent); }
.badge-queued { background: rgba(255,209,102,0.16); color: #ffd166; }
.badge-stale { background: rgba(138,147,164,0.15); color: var(--muted); }
.badge-inactive { background: rgba(138,147,164,0.15); color: var(--muted); }
.badge-failed { background: rgba(239,107,107,0.15); color: var(--danger); }
.processing-now { border: 1px solid rgba(110,168,254,0.45); background: rgba(110,168,254,0.09); border-radius: 6px; padding: 10px 12px; margin: 0 0 12px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row-now td { background: rgba(110,168,254,0.05); }
.queue-dashboard { margin-top: 12px; }
.queue-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.queue-card { border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; background: rgba(15,17,21,0.45); }
.queue-card span { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
.queue-card strong { display: block; margin-top: 4px; font-size: 22px; line-height: 1.1; }
.queue-table { table-layout: fixed; }
.queue-table th:nth-child(1), .queue-table td:nth-child(1) { width: 128px; }
.queue-table th:nth-child(3), .queue-table td:nth-child(3) { width: 90px; }
.queue-table th:nth-child(4), .queue-table td:nth-child(4) { width: 150px; }
.queue-table th:nth-child(6), .queue-table td:nth-child(6) { width: 120px; }
.queue-table td { vertical-align: top; }
.queue-table code { display: block; max-width: 100%; white-space: normal; }
.proxy-jobs { margin-top: 10px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.proxy-job { padding: 14px; background: var(--panel); }
.proxy-job + .proxy-job { border-top: 1px solid var(--border); }
.proxy-job-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 12px; }
.proxy-job-head code { min-width: 0; overflow-wrap: anywhere; }
.proxy-job-head form { background: none; border: 0; padding: 0; }
.proxy-progress-meta { display: flex; justify-content: space-between; gap: 12px; margin: 12px 0 5px 0; font-size: 13px; }
.proxy-job progress { display: block; width: 100%; height: 8px; }
.proxy-job .inline-error { margin: 10px 0 0 0; }
.worker-meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.worker-meta div { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; background: rgba(15,17,21,0.35); min-width: 0; }
.worker-meta span { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
.worker-meta code { display: block; max-width: 100%; white-space: normal; }
.preview-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.preview-panel video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #05070a; }
.preview-panel .hint { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--muted); }
.preview-empty { min-height: 260px; display: flex; flex-direction: column; justify-content: center; padding: 32px; background: #05070a; border-bottom: 1px solid var(--border); }
.preview-empty h3 { margin: 0 0 8px; font-size: 18px; }
.preview-empty p { margin: 0; color: var(--muted); max-width: 620px; }
form { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 20px; }
.field { margin-bottom: 16px; }
.field label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
.field input[type=text], .field input[type=password], .field select, .field textarea {
	width: 100%;
	padding: 8px 10px;
	background: var(--bg);
	border: 1px solid var(--border);
	border-radius: 4px;
	color: var(--text);
	font: inherit;
}
.field .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.field-inline { display: flex; align-items: center; gap: 8px; }
.field-inline label { margin-bottom: 0; }
.checkboxes { display: flex; flex-direction: column; gap: 6px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.error { background: rgba(239,107,107,0.1); border: 1px solid var(--danger); color: var(--danger); padding: 10px; border-radius: 4px; margin-bottom: 16px; }
.muted { color: var(--muted); }
code { background: var(--bg); padding: 1px 4px; border-radius: 3px; font-size: 12px; overflow-wrap: anywhere; word-break: break-word; }
.table-wrap { width: 100%; overflow-x: auto; }
.unit-log { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; margin: 16px 0; overflow: hidden; }
.unit-log header { padding: 12px 14px; border-bottom: 1px solid var(--border); gap: 10px; }
.unit-log h3 { font-size: 15px; margin: 0; }
.unit-meta { padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--border); }
.log-output { margin: 0; padding: 14px; max-height: 480px; overflow: auto; background: #090b0f; color: var(--text); font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; }
.inline-error { margin: 10px 14px; background: rgba(239,107,107,0.1); color: var(--danger); border: 1px solid var(--danger); border-radius: 4px; padding: 8px 10px; white-space: pre-wrap; }
.browser-panel { margin-top: 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); overflow: hidden; }
.browser-toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.browser-path { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.browser-list { max-height: 280px; overflow: auto; }
.browser-row { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 0; border-bottom: 1px solid var(--border); background: transparent; color: var(--text); text-align: left; cursor: pointer; font: inherit; }
.browser-row:hover { background: rgba(110,168,254,0.08); }
.browser-row:last-child { border-bottom: 0; }
.browser-kind { width: 42px; color: var(--muted); font-size: 11px; text-transform: uppercase; }
.browser-name { overflow-wrap: anywhere; }
.production-nav { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 4px; }
.production-nav a, .production-nav span { flex: 0 0 auto; padding: 7px 11px; border-radius: 5px; color: var(--muted); text-decoration: none; }
.production-nav a:hover, .production-nav a.active { color: var(--text); background: var(--panel); }
.production-nav span { opacity: .45; }
.production-page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 18px; }
.production-page-head h2 { margin: 0 0 3px; }
.production-list-toolbar { min-height: 43px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 7px 7px 0 0; background: var(--panel); }
.production-list-toolbar label { display: flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer; }
.production-list-toolbar input, .production-list-check { accent-color: var(--accent); }
.production-list-toolbar .selection-spacer { flex: 1; }
.production-list-toolbar .selection-count { display: none; }
.production-list-toolbar .selection-actions { display: flex; gap: 8px; visibility: hidden; }
.production-list-toolbar.has-selection .selection-idle { display: none; }
.production-list-toolbar.has-selection .selection-count { display: inline; }
.production-list-toolbar.has-selection .selection-actions { visibility: visible; }
.production-list { display: flex; flex-direction: column; border: 1px solid var(--border); border-top: 0; border-radius: 0 0 7px 7px; overflow: hidden; }
.production-list-item { display: grid; grid-template-columns: auto minmax(0,1fr); align-items: center; background: var(--panel); border-bottom: 1px solid var(--border); }
.production-list-item:last-child { border-bottom: 0; }
.production-list-item:hover { background: rgba(110,168,254,.08); }
.production-list-check { margin: 0 0 0 15px; }
.production-list-row { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 14px; min-width: 0; padding: 15px; color: var(--text); text-decoration: none; }
.production-list-row strong, .production-list-row span { display: block; }
.production-list-meta { margin-top: 3px; color: var(--muted); font-size: 12px; }
.production-list-side { display: flex; align-items: center; gap: 10px; }
.production-list-count { color: var(--muted); font-size: 12px; white-space: nowrap; }
.production-notice { margin-bottom: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); }
.bulk-form { display: none; }
.production-create-trigger { display: inline-flex; align-items: center; justify-content: center; min-width: 126px; min-height: 34px; margin: 0; padding: 6px 12px; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.workspace-selector { display: flex; align-items: end; gap: 8px; padding: 12px; margin-bottom: 18px; }
.workspace-selector .field { flex: 1; margin: 0; }
@media (max-width: 760px) {
	header { padding: 10px 12px; gap: 10px; flex-wrap: wrap; }
	header nav { order: 3; width: 100%; display: flex; overflow-x: auto; padding-bottom: 2px; }
	header nav a { flex: 0 0 auto; margin-right: 14px; }
	header .right { gap: 7px; }
	main { margin-top: 16px; padding: 0 12px; }
	.workspace-selector { align-items: stretch; flex-direction: column; }
	.workspace-selector .btn { width: 100%; text-align: center; }
	.queue-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
	.proxy-job-head { grid-template-columns: auto minmax(0, 1fr); }
	.proxy-job-head .proxy-attempt { grid-column: 2; }
	.proxy-job-head form { grid-column: 2; }
	.queue-table { min-width: 860px; }
	.worker-meta { grid-template-columns: 1fr; }
	.production-page-head { align-items: stretch; flex-direction: column; }
	.production-page-head > .btn { width: 100%; text-align: center; }
	.production-list-toolbar { flex-wrap: wrap; }
	.production-list-toolbar .selection-actions { width: 100%; }
	.production-list-toolbar .selection-actions .btn { flex: 1; }
	.production-list-row { grid-template-columns: 1fr; gap: 8px; padding: 13px; }
	.production-list-side { justify-content: space-between; }
	.production-create-trigger { width: 100%; text-align: center; }
	.production-new-popover { left: 0; right: 0; width: auto; }
}
</style>
<script>
function wireProductionSelection(root){
	const itemRoot=document.querySelector(root.dataset.selectionTarget)||root,all=root.querySelector('[data-select-all]'),items=[...itemRoot.querySelectorAll('[data-select-item]')],count=root.querySelector('[data-selected-count]'),buttons=[...root.querySelectorAll('[data-selection-action]')];
	function update(){const selected=items.filter(item=>item.checked);root.classList.toggle('has-selection',selected.length>0);all.checked=selected.length>0&&selected.length===items.length;all.indeterminate=selected.length>0&&selected.length<items.length;if(count)count.textContent=String(selected.length);for(const button of buttons){const requirement=button.dataset.selectionAction;button.disabled=!selected.length||selected.some(item=>item.dataset[requirement]!=='true')}}
	all?.addEventListener('change',()=>{for(const item of items)item.checked=all.checked;update()});for(const item of items)item.addEventListener('change',update);update();return {selected:()=>items.filter(item=>item.checked)}
}
</script>
</head>
<body>
<header>
	<h1>streamctl</h1>
	<nav>
		<a href="/">Streams</a>
		<a href="/endpoints">Endpoints</a>
		<a href="/production">Production</a>
		<a href="/render">Render</a>

		<a href="/worker">Worker</a>
		<a href="/nostr">Nostr</a>
	</nav>
	<div class="right">
		{{if currentUser}}<span>{{currentUser}}</span>{{end}}
		<form method="post" action="/logout" style="background: none; border: 0; padding: 0; margin: 0;">
			{{csrfField}}
			<button type="submit" class="btn">Log out</button>
		</form>
	</div>
</header>
<main>
{{template "content" .}}
</main>
</body>
</html>
{{end}}
{{define "productionNav"}}
<form class="workspace-selector" method="get" action="{{.Action}}"><div class="field"><label for="conference">Conference workspace</label><select id="conference" name="conference" required onchange="this.form.submit()"><option value="">Select a conference…</option>{{range .Conferences}}<option value="{{.Tag}}" {{if eq .Tag $.Conference}}selected{{end}}>{{if .Description}}{{.Description}} — {{end}}{{.Tag}} · {{.Date}}</option>{{end}}</select></div></form>
<nav class="production-nav"><a {{if eq .Active "overview"}}class="active"{{end}} href="/production{{if .Conference}}?conference={{urlquery .Conference}}{{end}}">Overview</a><a {{if eq .Active "cuts"}}class="active"{{end}} href="/production/cuts{{if .Conference}}?conference={{urlquery .Conference}}{{end}}">Cuts</a><a {{if eq .Active "templates"}}class="active"{{end}} href="/production/templates{{if .Conference}}?conference={{urlquery .Conference}}{{end}}">Templates</a><a {{if eq .Active "renders"}}class="active"{{end}} href="/production/renders{{if .Conference}}?conference={{urlquery .Conference}}{{end}}">Renders</a></nav>
{{end}}
