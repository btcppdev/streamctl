{{define "renderCreationDialog"}}
<dialog id="{{.Prefix}}-dialog" data-render-create="{{.Prefix}}" data-batch="{{.Batch}}" aria-labelledby="{{.Prefix}}-title" class="render-create-dialog">
<form data-role="form" method="post" action="/production/renders/create">
{{csrfField}}<input type="hidden" name="conference" value="{{.Conference}}"><input type="hidden" name="output" value="{{if .Batch}}separate{{else}}one{{end}}">
<div class="render-create-head"><h3 id="{{.Prefix}}-title">{{if .Batch}}Batch renders{{else}}New render{{end}}</h3><button class="btn" type="button" data-role="close">Close</button></div>
{{if .Batch}}<input type="hidden" name="include_talks" value="true"><p class="muted">One render per selected talk, named after its title.</p>{{else}}
<label class="field">Name<input type="text" name="name" placeholder="Untitled render"></label>
<label class="render-create-check"><input type="checkbox" data-role="include-talks" name="include_talks" value="true">Include talks</label>
{{end}}
<div data-role="talk-options" {{if not .Batch}}hidden{{end}}>
<label class="field">Talk template<select name="template_id" aria-label="Talk template"><option value="-1">None — saved cuts only</option><option value="0">Card + saved cuts</option>{{range .Templates}}<option value="{{.ID}}">{{.Name}}</option>{{end}}</select></label>
<div class="render-create-selection"><button class="btn" type="button" data-role="select-all">Select ready talks</button><button class="btn" type="button" data-role="clear">Clear</button></div>
<div data-role="talks" class="render-create-talks"></div>
</div>
<details class="settings-panel" data-role="options"><summary>Options</summary><div class="render-create-options"><section data-role="recording"></section><h4>Render settings</h4><div class="settings-grid" data-role="settings"></div></div></details>
<p data-role="status" class="muted" role="status" aria-live="polite"></p>
<button class="btn btn-primary" data-role="create" type="submit" {{if .Batch}}disabled{{end}}>{{if .Batch}}Create renders{{else}}Create blank render{{end}}</button>
</form></dialog>
{{end}}
{{define "renderCreationUI"}}
<style>
.render-create-actions{display:flex;gap:8px;flex-wrap:wrap}.render-create-dialog{width:min(620px,calc(100vw - 24px));max-height:88vh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:0}.render-create-dialog[data-batch="true"]{width:min(720px,calc(100vw - 24px))}.render-create-dialog form{margin:0;border:0;padding:20px}.render-create-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}.render-create-head h3{flex:1;margin:0}.render-create-dialog .field input,.render-create-dialog .field select{width:100%}.render-create-check{display:flex;align-items:center;gap:8px;margin:14px 0}.render-create-selection{display:flex;gap:8px;margin-top:10px}.render-create-talks{max-height:35vh;overflow:auto;display:grid;gap:10px;margin-top:12px}.render-create-options{padding:0 12px 12px}.render-create-options .settings-grid{padding:0}.render-create-options h4{margin:16px 0 8px}.render-create-dialog [data-role="status"]:empty{display:none}
</style>
<script>
function livestreamTalkGroups(talks){
 const groups=new Map();
 for(const talk of talks){
  const date=talk.starts_at?.slice(0,10);if(!date||!talk.stageLabel)continue;
  const key=date+'\u0000'+talk.stageLabel;
  if(!groups.has(key))groups.set(key,{date,label:(talk.dayLabel||date)+' · '+talk.stageLabel,talks:[]});
  groups.get(key).talks.push(talk);
 }
 return [...groups.values()].sort((a,b)=>a.date.localeCompare(b.date));
}

function createRenderCreationDialog(dialog,trigger,{batch=false}={}){
 const find=role=>dialog.querySelector('[data-role="'+role+'"]');
 const form=find('form'),status=find('status'),create=find('create'),close=find('close'),talkList=find('talks'),template=form.elements.template_id;
 const selectAll=find('select-all'),clear=find('clear'),includeTalks=find('include-talks'),talkOptions=find('talk-options');
 const hasTalks=()=>batch||includeTalks.checked;
 const creationSettings={},creationRegistration={registerRecording:batch};
 populateRenderSettings(find('settings'),creationSettings);
 const recordingControls=createRecordingControls(find('recording'),creationRegistration,{conference:form.elements.conference.value,batch});
 let talks=[],groups=[],busy=false,created=false,epoch=0,loading=false;
const talkChecks=()=>[...talkList.querySelectorAll('input[name="talk_ids"]')];
function selectionCount(){
 const count=talkChecks().filter(c=>c.checked).length;
 for(const {control,checks} of groups){const ready=checks.filter(c=>!c.disabled&&!c.manualOnly),selected=ready.filter(c=>c.checked).length;control.disabled=!ready.length;control.checked=ready.length>0&&selected===ready.length;control.indeterminate=selected>0&&selected<ready.length;}

 create.disabled=created||busy||(hasTalks()&&(loading||!count));
 create.textContent=!hasTalks()?'Create blank render':batch?(count?`Create ${count} renders`:'Create renders'):(count?`Create render with ${count} talk${count===1?'':'s'}`:'Create render');
 recordingControls.refresh(batch?'batch':'render',count===1?talkChecks().find(c=>c.checked).value:'',batch);
 status.textContent=!hasTalks()?'':count?`${count} talk${count===1?'':'s'} selected.`:'Select day/stage groups or individual talks.';
}
function groupControl(label,checks){
 const row=document.createElement('label');row.className='check-field';row.style.cssText='width:auto;white-space:normal;font-weight:600';
 const control=document.createElement('input');control.type='checkbox';control.setAttribute('aria-label','Select '+label);
 control.onchange=()=>{for(const check of checks)if(!check.disabled&&!check.manualOnly)check.checked=control.checked;selectionCount()};
 row.append(control,document.createTextNode(label));groups.push({control,checks});return row;
}
function showTalks(selected=new Set()){
 talkList.replaceChildren();groups=[];
 for(const group of livestreamTalkGroups(talks)){
  const section=document.createElement('section'),checks=[],heading=document.createElement('h4');heading.style.margin='12px 0';section.style.cssText='display:grid;gap:10px;padding-bottom:14px';section.append(heading);
  for(const talk of group.talks){
   const row=document.createElement('label');row.className='check-field';row.style.cssText='width:auto;white-space:normal;align-items:flex-start;margin-left:18px';
   const check=document.createElement('input');check.type='checkbox';check.name='talk_ids';check.value=talk.talk_id;check.disabled=!talk.ready;check.manualOnly=!!talk.manualOnly;check.checked=talk.ready&&selected.has(talk.talk_id);check.onchange=selectionCount;checks.push(check);
   const text=document.createElement('span'),title=document.createElement('strong'),detail=document.createElement('span');title.textContent=talk.title;detail.className='muted';detail.style.display='block';
   detail.textContent=[talk.timeLabel,talk.ready?(talk.manualOnly?'Individual selection only':'Ready'):talk.reason].filter(Boolean).join(' · ');
   text.append(title);appendProductionRecordingTag(text,talk.recordingNotice);text.append(detail);row.append(check,text);section.append(row);
  }
  heading.append(groupControl(group.label,checks));talkList.append(section);
 }
 selectionCount();if(!talks.length&&hasTalks())status.textContent='No scheduled talks are available.';
}
async function readResponse(response){if(!(response.headers.get('content-type')||'').includes('application/json'))throw Error(response.status===401||response.redirected?'Your session may have expired. Reload this page and sign in again.':'Could not load render data. Please try again.');return response.json()}
async function loadTalks(){
 const selected=new Set(talkChecks().filter(c=>c.checked).map(c=>c.value)),token=++epoch;loading=true;status.textContent='Loading talks…';create.disabled=true;selectAll.disabled=true;clear.disabled=true;talkList.replaceChildren();
 try{const response=await fetch(`/production/renders/create-options?conference=${encodeURIComponent(form.elements.conference.value)}&template_id=${encodeURIComponent(template.value)}`),result=await readResponse(response);if(token!==epoch||!dialog.open)return;if(!response.ok)throw Error(result.error);talks=result.talks;loading=false;showTalks(selected);selectAll.disabled=false;clear.disabled=false;}
 catch(error){if(token===epoch&&hasTalks())status.textContent=error.message}
 finally{if(token===epoch){loading=false;create.disabled=created||busy||(hasTalks()&&!talkChecks().some(c=>c.checked))}}
}
trigger.onclick=()=>{dialog.showModal();created=false;selectionCount();if(hasTalks())return loadTalks()};
if(includeTalks)includeTalks.onchange=()=>{talkOptions.hidden=!hasTalks();if(hasTalks()&&!talks.length)return loadTalks();selectionCount()};
selectAll.onclick=()=>{for(const c of talkChecks())if(!c.disabled&&!c.manualOnly)c.checked=true;selectionCount()};clear.onclick=()=>{for(const c of talkChecks())c.checked=false;selectionCount()};
close.onclick=()=>dialog.close();dialog.addEventListener('close',()=>{epoch++;trigger.focus()});dialog.addEventListener('cancel',event=>{if(busy)event.preventDefault()});template.onchange=loadTalks;
form.onsubmit=async event=>{
 event.preventDefault();if(busy||(hasTalks()&&loading)||create.disabled)return;const data=new URLSearchParams(new FormData(form));data.set('settings',JSON.stringify(creationSettings));data.set('register_recording',String(creationRegistration.registerRecording));data.set('recording_talk_id',creationRegistration.recordingTalkId||'');if(!hasTalks())data.delete('talk_ids');busy=true;create.disabled=true;
 for(const node of form.querySelectorAll('select,input,button'))node.disabled=true;
 status.textContent=batch?'Creating renders…':'Creating render…';
 try{const response=await fetch(form.action,{method:'POST',body:data}),result=await readResponse(response);if(!response.ok)throw Error(result.error);created=true;window.location.assign(result.url)}
 catch(error){status.textContent=error.message}
 finally{busy=false;for(const node of form.querySelectorAll('select,input,button'))node.disabled=false;for(const c of talkChecks())c.disabled=!talks.find(t=>t.talk_id===c.value)?.ready;for(const {control,checks} of groups)control.disabled=!checks.some(c=>!c.disabled&&!c.manualOnly);create.disabled=created||(hasTalks()&&!talkChecks().some(c=>c.checked))}
};
}
</script>
{{end}}
